<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Coin Catcher</title>
    <!-- Tailwind CSS for UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js for 3D graphics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- MediaPipe Hands for hand tracking -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Inter', sans-serif;
            touch-action: none; /* Prevent scrolling on mobile */
        }
        
        #video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        #input-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror the video */
        }

        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none; /* Let clicks pass through if needed, though we use hand tracking */
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
        }

        .hidden {
            display: none !important;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        /* Debug overlay */
        #debug-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 3;
            pointer-events: none;
            transform: scaleX(-1);
        }
    </style>
</head>
<body>

    <!-- Video background for AR -->
    <div id="video-container">
        <video id="input-video" playsinline autoplay muted></video>
    </div>

    <!-- MediaPipe debug canvas (optional, useful for seeing tracking) -->
    <canvas id="debug-canvas"></canvas>

    <!-- Three.js Canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- Start Screen UI -->
    <div id="start-screen" class="ui-layer bg-black bg-opacity-60 transition-opacity duration-500">
        <div class="glass-panel p-8 rounded-3xl text-center max-w-md mx-4">
            <h1 class="text-4xl font-extrabold text-white mb-4 tracking-wider text-yellow-400 drop-shadow-md">AR Coin Catcher</h1>
            <p class="text-white text-lg mb-6">
                ใช้นิ้วชี้ของคุณเพื่อแตะเก็บ <span class="text-yellow-300 font-bold">เหรียญทอง</span><br>
                และระวังอย่าให้โดน <span class="text-gray-400 font-bold">ก้อนหิน</span>!
            </p>
            <div class="flex justify-center space-x-4 mb-6">
                <div class="flex flex-col items-center">
                    <div class="w-12 h-12 bg-yellow-400 rounded-full mb-2 border-4 border-yellow-600 shadow-lg flex items-center justify-center font-bold text-yellow-800">C</div>
                    <span class="text-xs text-white">+10 แต้ม</span>
                </div>
                <div class="flex flex-col items-center">
                    <div class="w-12 h-12 bg-gray-600 rounded-lg mb-2 shadow-lg flex items-center justify-center text-xl">🪨</div>
                    <span class="text-xs text-red-400">เกมโอเวอร์</span>
                </div>
            </div>
            <p id="loading-text" class="text-yellow-300 mb-4 animate-pulse">กำลังเตรียมกล้องและระบบ AI...</p>
            <button id="start-btn" class="hidden w-full bg-gradient-to-r from-green-400 to-blue-500 hover:from-green-500 hover:to-blue-600 text-white font-bold py-3 px-6 rounded-full text-xl shadow-lg transform transition hover:scale-105 active:scale-95">
                เริ่มเล่นเลย!
            </button>
        </div>
    </div>

    <!-- In-Game HUD -->
    <div id="hud" class="hidden absolute top-0 left-0 w-full p-4 z-10 flex justify-between items-start pointer-events-none">
        <div class="glass-panel px-4 py-2 rounded-full flex items-center space-x-2">
            <span class="text-2xl">🪙</span>
            <span id="score-display" class="text-2xl font-bold text-white drop-shadow-md">0</span>
        </div>
        <div class="glass-panel px-3 py-1 rounded-full flex items-center">
             <span class="text-sm font-semibold text-white">Level <span id="level-display">1</span></span>
        </div>
    </div>

    <!-- Game Over Screen UI -->
    <div id="game-over-screen" class="hidden ui-layer bg-red-900 bg-opacity-80 backdrop-blur-sm transition-opacity duration-300">
        <div class="glass-panel p-8 rounded-3xl text-center max-w-sm mx-4 transform scale-95 transition-transform duration-300" id="game-over-panel">
            <h2 class="text-5xl font-black text-white mb-2 tracking-tighter">GAME OVER</h2>
            <p class="text-red-200 mb-6">คุณโดนก้อนหิน!</p>
            
            <div class="bg-black bg-opacity-30 rounded-xl p-4 mb-8">
                <p class="text-sm text-gray-300 uppercase tracking-widest mb-1">คะแนนของคุณ</p>
                <p id="final-score" class="text-6xl font-bold text-yellow-400 drop-shadow-lg">0</p>
            </div>
            
            <button id="restart-btn" class="w-full bg-white text-red-900 hover:bg-gray-100 font-bold py-3 px-6 rounded-full text-xl shadow-lg transform transition hover:scale-105 active:scale-95">
                เล่นอีกครั้ง
            </button>
        </div>
    </div>

    <script>
        // --- Game State ---
        let gameState = 'loading'; // loading, ready, playing, gameover
        let score = 0;
        let level = 1;
        let baseFallSpeed = 0.03;
        let spawnRate = 1000; // ms between spawns
        let lastSpawnTime = 0;
        let animationId;
        
        // --- DOM Elements ---
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        const loadingText = document.getElementById('loading-text');
        const hud = document.getElementById('hud');
        const scoreDisplay = document.getElementById('score-display');
        const levelDisplay = document.getElementById('level-display');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScore = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');
        const videoElement = document.getElementById('input-video');
        const debugCanvas = document.getElementById('debug-canvas');
        const debugCtx = debugCanvas.getContext('2d');

        // --- Three.js Setup ---
        const canvas = document.getElementById('game-canvas');
        const scene = new THREE.Scene();
        
        // Camera setup for AR - orthographic is often easier to map screen coordinates to
        const aspect = window.innerWidth / window.innerHeight;
        // Adjust camera frustum based on aspect ratio to cover screen
        const frustumSize = 10; 
        const camera = new THREE.OrthographicCamera( 
            frustumSize * aspect / - 2, 
            frustumSize * aspect / 2, 
            frustumSize / 2, 
            frustumSize / - 2, 
            0.1, 
            100 
        );
        camera.position.z = 10;
        
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 7);
        scene.add(directionalLight);

        // Game Objects Array
        let fallingObjects = [];
        
        // Visual indicator for the pointer finger
        const pointerGeometry = new THREE.SphereGeometry(0.3, 16, 16);
        const pointerMaterial = new THREE.MeshBasicMaterial({ 
            color: 0x00ff00, 
            transparent: true, 
            opacity: 0.7,
            wireframe: true
        });
        const pointerMesh = new THREE.Mesh(pointerGeometry, pointerMaterial);
        scene.add(pointerMesh);
        // Hide initially
        pointerMesh.visible = false;
        
        // Variables to store finger position in 3D space
        let pointerPosition = new THREE.Vector3();
        let isHandDetected = false;

        // --- Resize Handler ---
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            
            renderer.setSize(width, height);
            debugCanvas.width = width;
            debugCanvas.height = height;
            
            const aspect = width / height;
            camera.left = -frustumSize * aspect / 2;
            camera.right = frustumSize * aspect / 2;
            camera.top = frustumSize / 2;
            camera.bottom = -frustumSize / 2;
            camera.updateProjectionMatrix();
        });

        // Setup debug canvas size
        debugCanvas.width = window.innerWidth;
        debugCanvas.height = window.innerHeight;

        // --- Materials for Game Objects ---
        const coinGeometry = new THREE.CylinderGeometry(0.4, 0.4, 0.1, 32);
        const coinMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xffd700,
            metalness: 0.8,
            roughness: 0.2,
        });

        // Custom rough rock geometry
        const rockGeometry = new THREE.DodecahedronGeometry(0.5, 1);
        const rockMaterial = new THREE.MeshStandardMaterial({
            color: 0x555555,
            roughness: 0.9,
            metalness: 0.1,
            flatShading: true
        });

        // Particle system for coin collection
        const particles = [];
        const particleGeometry = new THREE.BoxGeometry(0.1, 0.1, 0.1);
        const particleMaterial = new THREE.MeshBasicMaterial({ color: 0xffd700 });

        // --- Game Logic Functions ---
        function spawnObject() {
            if (gameState !== 'playing') return;

            // Determine if coin or rock (e.g., 70% coin, 30% rock)
            const isCoin = Math.random() > 0.3;
            
            let mesh;
            if (isCoin) {
                mesh = new THREE.Mesh(coinGeometry, coinMaterial);
                mesh.rotation.x = Math.PI / 2; // Stand coin up
                mesh.userData = { type: 'coin', radius: 0.4 };
            } else {
                mesh = new THREE.Mesh(rockGeometry, rockMaterial);
                // Random rotation for rocks
                mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
                mesh.userData = { type: 'rock', radius: 0.5 };
            }

            // Calculate spawn bounds based on camera frustum
            const aspect = window.innerWidth / window.innerHeight;
            const xBound = (frustumSize * aspect / 2) - 0.5; // Padding
            const spawnX = (Math.random() * xBound * 2) - xBound;
            
            // Start above the screen
            const spawnY = (frustumSize / 2) + 1;

            mesh.position.set(spawnX, spawnY, 0);
            
            // Add custom speed variation
            mesh.userData.speedMultiplier = 0.8 + (Math.random() * 0.4); // 0.8x to 1.2x base speed
            mesh.userData.rotationSpeed = {
                x: (Math.random() - 0.5) * 0.1,
                y: (Math.random() - 0.5) * 0.1,
                z: (Math.random() - 0.5) * 0.1
            };

            scene.add(mesh);
            fallingObjects.push(mesh);
        }

        function createParticles(position) {
            for (let i = 0; i < 10; i++) {
                const particle = new THREE.Mesh(particleGeometry, particleMaterial);
                particle.position.copy(position);
                
                // Random velocity
                particle.userData = {
                    velocity: new THREE.Vector3(
                        (Math.random() - 0.5) * 0.2,
                        (Math.random() - 0.5) * 0.2,
                        (Math.random() - 0.5) * 0.2
                    ),
                    life: 1.0 // 1.0 to 0.0
                };
                
                scene.add(particle);
                particles.push(particle);
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.position.add(p.userData.velocity);
                p.userData.life -= 0.05;
                p.scale.setScalar(p.userData.life);
                
                if (p.userData.life <= 0) {
                    scene.remove(p);
                    particles.splice(i, 1);
                }
            }
        }

        function checkCollisions() {
            if (!isHandDetected) return;

            for (let i = fallingObjects.length - 1; i >= 0; i--) {
                const obj = fallingObjects[i];
                
                // Simple distance-based collision
                const distance = pointerPosition.distanceTo(obj.position);
                const collisionThreshold = obj.userData.radius + 0.3; // Object radius + pointer radius
                
                if (distance < collisionThreshold) {
                    // Collision occurred!
                    if (obj.userData.type === 'coin') {
                        // Collect coin
                        score += 10;
                        scoreDisplay.textContent = score;
                        createParticles(obj.position);
                        
                        // Increase difficulty
                        if (score % 50 === 0) {
                            level++;
                            levelDisplay.textContent = level;
                            baseFallSpeed += 0.005;
                            spawnRate = Math.max(300, spawnRate - 100);
                        }
                        
                        scene.remove(obj);
                        fallingObjects.splice(i, 1);
                    } else if (obj.userData.type === 'rock') {
                        // Hit rock - Game Over
                        gameOver();
                    }
                }
            }
        }

        function updateGame(time) {
            if (gameState !== 'playing') return;

            // Spawn logic
            if (time - lastSpawnTime > spawnRate) {
                spawnObject();
                lastSpawnTime = time;
            }

            // Move objects
            const bottomBound = -(frustumSize / 2) - 1;
            
            for (let i = fallingObjects.length - 1; i >= 0; i--) {
                const obj = fallingObjects[i];
                
                // Fall down
                obj.position.y -= baseFallSpeed * obj.userData.speedMultiplier;
                
                // Rotate
                obj.rotation.x += obj.userData.rotationSpeed.x;
                obj.rotation.y += obj.userData.rotationSpeed.y;
                obj.rotation.z += obj.userData.rotationSpeed.z;

                // Remove if off screen
                if (obj.position.y < bottomBound) {
                    scene.remove(obj);
                    fallingObjects.splice(i, 1);
                }
            }

            checkCollisions();
            updateParticles();
            
            // Visual feedback for pointer based on hand detection
            if (isHandDetected) {
                pointerMesh.visible = true;
                pointerMesh.position.copy(pointerPosition);
                // Pulse effect
                const scale = 1 + Math.sin(time * 0.01) * 0.2;
                pointerMesh.scale.set(scale, scale, scale);
            } else {
                pointerMesh.visible = false;
            }
        }

        // --- MediaPipe Setup ---
        function onResults(results) {
            // Clear debug canvas
            debugCtx.clearRect(0, 0, debugCanvas.width, debugCanvas.height);
            
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                isHandDetected = true;
                
                // Get the first hand detected
                const landmarks = results.multiHandLandmarks[0];
                
                // Index Finger Tip is landmark 8
                const indexTip = landmarks[8];
                
                // Draw debug visual (red dot on index tip)
                if (gameState === 'playing') {
                    debugCtx.fillStyle = '#ff0000';
                    debugCtx.beginPath();
                    // Note: MediaPipe coords are 0-1, so multiply by canvas size
                    // Since video is mirrored via CSS, we need to handle coordinates correctly
                    debugCtx.arc(indexTip.x * debugCanvas.width, indexTip.y * debugCanvas.height, 5, 0, 2 * Math.PI);
                    debugCtx.fill();
                }

                // Map MediaPipe coordinates (0 to 1) to Three.js Orthographic Camera coordinates
                // Note: The video input is mirrored, and MediaPipe x is 0 on left, 1 on right of original image
                // Because we mirrored the video element, MediaPipe's x=0 is visually on the right side of the screen.
                // We need to map this carefully.
                
                const aspect = window.innerWidth / window.innerHeight;
                
                // Map x: MediaPipe 0->1 maps to Camera Right->Left because of mirror
                // So MP x=0 -> screen right (positive X in threejs)
                // MP x=1 -> screen left (negative X in threejs)
                const mappedX = -((indexTip.x - 0.5) * frustumSize * aspect); 
                
                // Map y: MediaPipe 0->1 maps to Camera Top->Bottom
                // MP y=0 (top) -> positive Y in threejs
                // MP y=1 (bottom) -> negative Y in threejs
                const mappedY = -((indexTip.y - 0.5) * frustumSize);

                // Smooth out movement (simple lerp)
                pointerPosition.x += (mappedX - pointerPosition.x) * 0.4;
                pointerPosition.y += (mappedY - pointerPosition.y) * 0.4;
                pointerPosition.z = 0; // Keep on the same plane as objects
                
            } else {
                isHandDetected = false;
            }
        }

        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});
        
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 0, // Lower complexity for better performance on mobile
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        
        hands.onResults(onResults);

        // --- Camera Setup ---
        let cameraObj;
        async function setupCamera() {
            try {
                cameraObj = new Camera(videoElement, {
                    onFrame: async () => {
                        await hands.send({image: videoElement});
                    },
                    width: 640,
                    height: 480
                });
                await cameraObj.start();
                
                // Camera ready, update UI
                gameState = 'ready';
                loadingText.classList.add('hidden');
                startBtn.classList.remove('hidden');
                
            } catch (error) {
                console.error("Error accessing camera:", error);
                loadingText.textContent = "ไม่สามารถเปิดกล้องได้ โปรดอนุญาตการเข้าถึงกล้อง";
                loadingText.classList.remove('text-yellow-300', 'animate-pulse');
                loadingText.classList.add('text-red-500');
            }
        }

        // --- Game Flow Controllers ---
        function startGame() {
            gameState = 'playing';
            score = 0;
            level = 1;
            baseFallSpeed = 0.03;
            spawnRate = 1000;
            
            scoreDisplay.textContent = score;
            levelDisplay.textContent = level;
            
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            hud.classList.remove('hidden');
            
            // Clear existing objects
            fallingObjects.forEach(obj => scene.remove(obj));
            fallingObjects = [];
            particles.forEach(p => scene.remove(p));
            particles.length = 0;
            
            lastSpawnTime = performance.now();
        }

        function gameOver() {
            gameState = 'gameover';
            hud.classList.add('hidden');
            gameOverScreen.classList.remove('hidden');
            finalScore.textContent = score;
            
            // Add a little pop animation to the panel
            const panel = document.getElementById('game-over-panel');
            panel.classList.remove('scale-95');
            panel.classList.add('scale-100');
            setTimeout(() => {
                panel.classList.remove('scale-100');
                panel.classList.add('scale-95');
            }, 150);
        }

        // Event Listeners
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        // Main Animation Loop
        function animate(time) {
            requestAnimationFrame(animate);
            
            updateGame(time);
            
            // Rotate all coins slowly even when falling for visual flair
            fallingObjects.forEach(obj => {
                if(obj.userData.type === 'coin'){
                     obj.rotation.z += 0.05;
                }
            });

            renderer.render(scene, camera);
        }

        // --- Initialization ---
        window.onload = () => {
            setupCamera();
            requestAnimationFrame(animate);
        };

    </script>
</body>
</html>
